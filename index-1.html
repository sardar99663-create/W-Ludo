<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d1b"><title>W-Ludo</title><link rel="stylesheet" href="style.css"></head><body><header><b class="logo">W-Ludo</b><button id="exit">🚪</button></header><main><section id="setup" class="panel"><small>NEON CLASSIC EDITION</small><h1>Ready to <em>Roll?</em></h1><label>Players <select id="count"><option>2</option><option>3</option><option selected>4</option></select></label><div id="picks"></div><button class="primary" id="start">Start New Game</button><button id="resume" class="secondary" hidden>Continue Saved Game</button></section><section id="game" hidden><div class="heading"><h2>W-Ludo Arena</h2><b id="turn"></b></div><div class="layout"><div class="board-frame"><div id="board"></div></div><aside class="panel"><small>CURRENT PLAYER</small><h2 id="who"></h2><button id="dice" class="dice">⚄</button><p id="hint">Tap dice to roll</p><div id="players"></div><label class="sound">Sound effects <input id="sound" type="checkbox" checked></label></aside></div></section></main><dialog id="exitDialog"><h2>Leave this match?</h2><p>Your game will remain saved.</p><button id="cancel" class="secondary">✕ Cancel</button><button id="confirm" class="danger">Confirm</button></dialog><dialog id="winDialog"><h2 id="winner"></h2><button id="again" class="primary">Play Again</button></dialog><footer>W-Ludo · Local multiplayer · Offline-ready after first load</footer><script src="game.js"></script></body></html>
